# Intel + macOS 13 冒烟测试。
#
# 为什么存在：维护者的手边只有 Apple Silicon 机器，而 Intel 老机型的用户
# （2017 款 MacBook Pro 这类）报告过需求。GitHub 的 macos-13 runner 是
# 真实的 x86_64 + macOS 13 环境，正好是「本项目声称支持的最低配置」，
# 用它来证明三件事：
#   1. x86_64 侧在 macOS 13 上编得过（API 可用性由编译器把关）；
#   2. 纯逻辑自测（--auto-scenarios）在 Intel + macOS 13 上全绿；
#   3. 产出的二进制确实是 x86_64。
# 图形界面和真实显示器行为在无头 runner 上测不了，那部分仍需真机反馈。
name: intel-smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-13   # 最后一代 Intel runner：x86_64 + macOS 13 Ventura
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 编译（x86_64，macOS 13）
        run: swift build -c release --disable-sandbox

      - name: 确认产物架构
        run: |
          BIN=$(swift build -c release --disable-sandbox --show-bin-path)/DisplayMaster
          file "$BIN"
          vtool -show "$BIN" | grep -E "platform|minos"

      - name: 纯逻辑自测（45 条场景）
        run: |
          BIN=$(swift build -c release --disable-sandbox --show-bin-path)/DisplayMaster
          "$BIN" --selftest
          "$BIN" --auto-scenarios
